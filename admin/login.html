<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wheel 4U | Admin Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background: #030303;
    }

    .background {
      position: fixed;
      inset: -20px;
      background:
        linear-gradient(
          rgba(0,0,0,0.76),
          rgba(0,0,0,0.88)
        ),
        url("../wheel4u-home-bg.png") center / cover no-repeat;
      filter: blur(3px);
      transform: scale(1.05);
    }

    .red-glow {
      position: fixed;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: rgba(220,0,0,0.13);
      filter: blur(100px);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .login-page {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      perspective: 1200px;
    }

    .login-card {
      width: min(430px, 100%);
      padding: 45px 38px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(10,10,10,0.68);
      backdrop-filter: blur(25px);
      box-shadow:
        0 30px 100px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.08);
      text-align: center;
      transform-style: preserve-3d;
      animation: cardIn 1s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(35px) rotateX(8deg);
      }

      to {
        opacity: 1;
        transform: translateY(0) rotateX(0);
      }
    }

    .logo {
      width: 155px;
      max-width: 70%;
      margin-bottom: 25px;
      filter: drop-shadow(0 10px 25px rgba(0,0,0,0.6));
    }

    .label {
      color: #e00000;
      font-size: 9px;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 30px;
      letter-spacing: -1px;
      text-transform: uppercase;
    }

    .subtitle {
      margin-top: 10px;
      color: #777;
      font-size: 11px;
      line-height: 1.6;
    }

    form {
      margin-top: 32px;
      text-align: left;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: #aaa;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 17px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.13);
      outline: none;
      background: rgba(255,255,255,0.045);
      color: white;
      font-size: 13px;
      transition: 0.3s ease;
    }

    input::placeholder {
      color: #555;
    }

    input:focus {
      border-color: rgba(224,0,0,0.75);
      background: rgba(255,255,255,0.07);
      box-shadow: 0 0 25px rgba(224,0,0,0.08);
    }

    .login-btn {
      width: 100%;
      height: 54px;
      margin-top: 8px;
      border: 0;
      border-radius: 14px;
      background: #e00000;
      color: white;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.35s ease;
      box-shadow: 0 12px 30px rgba(224,0,0,0.2);
    }

    .login-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 40px rgba(224,0,0,0.35);
    }

    .login-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .error {
      min-height: 18px;
      margin-top: 14px;
      color: #ff4b4b;
      font-size: 10px;
      text-align: center;
    }

    .security {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
      color: #555;
      font-size: 9px;
      letter-spacing: 1px;
      line-height: 1.7;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #777;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      transition: 0.3s;
    }

    .back:hover {
      color: white;
    }

    @media (max-width: 500px) {

      .login-page {
        padding: 16px;
      }

      .login-card {
        padding: 35px 24px;
        border-radius: 22px;
      }

      h1 {
        font-size: 26px;
      }

      .logo {
        width: 135px;
      }
    }
  </style>
</head>

<body>

  <div class="background"></div>
  <div class="red-glow"></div>

  <main class="login-page">

    <div class="login-card">

      <img
        src="../wheel4u-logo.png"
        alt="Wheel 4U"
        class="logo"
      >

      <div class="label">
        Private Access
      </div>

      <h1>Admin Login</h1>

      <p class="subtitle">
        Wheel 4U Management Portal
      </p>

      <form id="loginForm">

        <div class="field">

          <label for="adminId">
            Admin Email
          </label>

          <div class="input-wrap">

            <input
              type="email"
              id="adminId"
              placeholder="Enter admin email"
              autocomplete="username"
              required
            >

          </div>

        </div>

        <div class="field">

          <label for="password">
            Password
          </label>

          <div class="input-wrap">

            <input
              type="password"
              id="password"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            >

          </div>

        </div>

        <button
          type="submit"
          class="login-btn"
          id="loginButton"
        >
          Enter Dashboard →
        </button>

        <div
          class="error"
          id="error"
          aria-live="polite"
        ></div>

      </form>

      <div class="security">
        🔒 AUTHORIZED ADMINISTRATORS ONLY
      </div>

      <a
        href="../index.html"
        class="back"
      >
        ← Back to Wheel 4U
      </a>

    </div>

  </main>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Wheel 4U Supabase Configuration -->
  <script src="supabase-config.js"></script>

  <script>

    /* =========================================
       SUPABASE CLIENT
    ========================================= */

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    /* =========================================
       ELEMENTS
    ========================================= */

    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("error");
    const loginButton = document.getElementById("loginButton");


    /* =========================================
       CHECK EXISTING SESSION
    ========================================= */

    async function checkExistingSession() {

      const {
        data: {
          session
        }
      } = await supabaseClient.auth.getSession();

      if (session) {
        window.location.href = "dashboard.html";
      }

    }

    checkExistingSession();


    /* =========================================
       LOGIN
    ========================================= */

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      errorBox.textContent = "";

      const email = document
        .getElementById("adminId")
        .value
        .trim();

      const password = document
        .getElementById("password")
        .value;


      if (!email || !password) {

        errorBox.textContent =
          "Please enter your email and password.";

        return;
      }


      /* Loading state */

      loginButton.disabled = true;

      loginButton.textContent =
        "Signing In...";


      try {

        const {
          data,
          error: loginError
        } = await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


        /* Login failed */

        if (loginError) {

          console.error(
            "Wheel 4U login error:",
            loginError
          );

          errorBox.textContent =
            "Invalid email or password.";

          loginButton.disabled = false;

          loginButton.textContent =
            "Enter Dashboard →";

          return;
        }


        /* Login successful */

        if (data && data.session) {

          window.location.href =
            "dashboard.html";

          return;
        }


        /* Unexpected result */

        errorBox.textContent =
          "Login could not be completed. Please try again.";

        loginButton.disabled = false;

        loginButton.textContent =
          "Enter Dashboard →";

      }

      catch (error) {

        console.error(
          "Unexpected Wheel 4U login error:",
          error
        );

        errorBox.textContent =
          "Something went wrong. Please try again.";

        loginButton.disabled = false;

        loginButton.textContent =
          "Enter Dashboard →";

      }

    });

  </script>

</body>
</html>
