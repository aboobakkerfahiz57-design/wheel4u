<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wheel 4U | Reset Password</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background: #030303;
    }

    .background {
      position: fixed;
      inset: -20px;
      background:
        linear-gradient(
          rgba(0,0,0,0.76),
          rgba(0,0,0,0.88)
        ),
        url("../wheel4u-home-bg.png") center / cover no-repeat;
      filter: blur(3px);
      transform: scale(1.05);
    }

    .red-glow {
      position: fixed;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: rgba(220,0,0,0.13);
      filter: blur(100px);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .reset-page {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .reset-card {
      width: min(430px, 100%);
      padding: 45px 38px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(10,10,10,0.68);
      backdrop-filter: blur(25px);
      box-shadow:
        0 30px 100px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.08);
      text-align: center;
      animation: cardIn 0.8s ease;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      width: 155px;
      max-width: 70%;
      margin-bottom: 25px;
      filter: drop-shadow(0 10px 25px rgba(0,0,0,0.6));
    }

    .label {
      color: #e00000;
      font-size: 9px;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 30px;
      letter-spacing: -1px;
      text-transform: uppercase;
    }

    .subtitle {
      margin-top: 10px;
      color: #777;
      font-size: 11px;
      line-height: 1.6;
    }

    form {
      margin-top: 32px;
      text-align: left;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: #aaa;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 17px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.13);
      outline: none;
      background: rgba(255,255,255,0.045);
      color: white;
      font-size: 13px;
      transition: 0.3s ease;
    }

    input::placeholder {
      color: #555;
    }

    input:focus {
      border-color: rgba(224,0,0,0.75);
      background: rgba(255,255,255,0.07);
      box-shadow: 0 0 25px rgba(224,0,0,0.08);
    }

    .reset-btn {
      width: 100%;
      height: 54px;
      margin-top: 8px;
      border: 0;
      border-radius: 14px;
      background: #e00000;
      color: white;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.35s ease;
      box-shadow: 0 12px 30px rgba(224,0,0,0.2);
    }

    .reset-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 40px rgba(224,0,0,0.35);
    }

    .reset-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .message {
      min-height: 20px;
      margin-top: 14px;
      font-size: 10px;
      text-align: center;
    }

    .error {
      color: #ff4b4b;
    }

    .success {
      color: #52d273;
    }

    .security {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
      color: #555;
      font-size: 9px;
      letter-spacing: 1px;
      line-height: 1.7;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #777;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      transition: 0.3s;
    }

    .back:hover {
      color: white;
    }

    @media (max-width: 500px) {

      .reset-page {
        padding: 16px;
      }

      .reset-card {
        padding: 35px 24px;
        border-radius: 22px;
      }

      h1 {
        font-size: 26px;
      }

      .logo {
        width: 135px;
      }
    }
  </style>
</head>

<body>

  <div class="background"></div>
  <div class="red-glow"></div>

  <main class="reset-page">

    <div class="reset-card">

      <img
        src="../wheel4u-logo.png"
        alt="Wheel 4U"
        class="logo"
      >

      <div class="label">
        Secure Account
      </div>

      <h1>Reset Password</h1>

      <p class="subtitle">
        Create a new password for your Wheel 4U admin account.
      </p>

      <form id="resetForm">

        <div class="field">

          <label for="newPassword">
            New Password
          </label>

          <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
            minlength="6"
            autocomplete="new-password"
            required
          >

        </div>

        <div class="field">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            minlength="6"
            autocomplete="new-password"
            required
          >

        </div>

        <button
          type="submit"
          class="reset-btn"
          id="resetButton"
        >
          Update Password →
        </button>

        <div
          class="message"
          id="message"
          aria-live="polite"
        ></div>

      </form>

      <div class="security">
        🔒 WHEEL 4U SECURE ADMIN ACCESS
      </div>

      <a
        href="login.html"
        class="back"
      >
        ← Back to Admin Login
      </a>

    </div>

  </main>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Wheel 4U Supabase Configuration -->
  <script src="supabase-config.js"></script>

  <script>

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const resetButton = document.getElementById("resetButton");


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      message.textContent = "";
      message.className = "message";


      const newPassword =
        document.getElementById("newPassword").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;


      if (newPassword.length < 6) {

        message.textContent =
          "Password must be at least 6 characters.";

        message.classList.add("error");

        return;
      }


      if (newPassword !== confirmPassword) {

        message.textContent =
          "Passwords do not match.";

        message.classList.add("error");

        return;
      }


      resetButton.disabled = true;

      resetButton.textContent =
        "Updating...";


      try {

        const {
          error
        } = await supabaseClient.auth.updateUser({
          password: newPassword
        });


        if (error) {

          console.error(
            "Password update error:",
            error
          );

          message.textContent =
            "Password reset failed. Please request a new reset link.";

          message.classList.add("error");

          resetButton.disabled = false;

          resetButton.textContent =
            "Update Password →";

          return;
        }


        message.textContent =
          "Password updated successfully. Redirecting to login...";

        message.classList.add("success");


        setTimeout(function() {

          window.location.href =
            "login.html";

        }, 1800);

      }

      catch (error) {

        console.error(
          "Unexpected password reset error:",
          error
        );

        message.textContent =
          "Something went wrong. Please request a new reset link.";

        message.classList.add("error");

        resetButton.disabled = false;

        resetButton.textContent =
          "Update Password →";

      }

    });

  </script>

</body>
</html>
